[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plumbreport"
version = "0.1.0"
description = "PLUMB deep-dive evidence report: binds a report spec to verified research statements and renders A4 HTML/PDF with a client-face lint."
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = ["jinja2>=3.1", "markdown>=3.4", "pyyaml>=6.0", "pypdf>=4.0", "playwright>=1.40"]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.scripts]
plumbreport = "plumbreport.cli:main"

[tool.setuptools]
packages = ["plumbreport"]

[tool.setuptools.package-data]
plumbreport = ["templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
