# --------------------------------------------------------------------------- 7
- id: hypotheses
  title: Hypotheses and how an assessment would test them
  blocks:
  - type: lead
    storyline: hypotheses.title
  - type: para
    text: "The public record shows where AI is in use, but not what it is worth or how it is governed. Each hypothesis below is stated so that it can be shown to be wrong. For each, we set out how the assessment would test it and what result would reject it."
  - type: hypotheses
    head: ["Hypothesis", "How the assessment would test it", "What would reject it"]
    rows:
    - storyline: hypotheses.cards[0]
      how: "Measure leakage, fraud and adjudication outcomes on accident and health claims before and after the claims AI, and size them against the scenario 4 sensitivity."
      refute: "Measured improvement attributable to AI below 2% of accident and health claims, or not reachable within 18 months."
      support: [great-eastern.findings.deploy.2, great-eastern.findings.deploy.6]
      figures: [ah_sg, ah_my]
    - storyline: hypotheses.cards[1]
      how: "Map Great Eastern's AI uses to a risk-tiered inventory and test each MAS expectation against the controls OCBC group frameworks already provide."
      refute: "Most expectations need controls that group frameworks do not provide."
      support: [great-eastern.findings.leadership.1, great-eastern.findings.governance.1]
    - storyline: hypotheses.cards[2]
      how: "Review the complex-underwriting AI's test evidence, the criteria for production and who decides, in interviews with underwriting, risk and Data & AI leads."
      refute: "The model has not yet met its accuracy target, while production criteria and decision rights are already defined."
      support: [great-eastern.findings.deploy.3]
  - type: questions
    head: "Questions we would put to management"
    items:
    - great-eastern.findings.q.measurement
    - great-eastern.findings.q.testing.3
    - great-eastern.findings.q.governance
    - great-eastern.findings.q.group
    - great-eastern.findings.q.opmodel
    - great-eastern.findings.q.successor
  - type: plan
    head: "How the assessment would run"
    storyline: proposal
    intro: "A six-week assessment would test these hypotheses with the leadership team."
    close: "Proposed next step: a 45-minute working session with the Group CEO, COO, CRO and Data & AI lead."

