- id: method
  kind: appendix
  letter: B
  title: Method
  blocks:
  - type: para
    text: "This report is built so that every statement can be traced to the page it comes from. The steps below apply to every quotation and every summary sentence in it."
  - type: method
    items:
    - head: "Statements start from a stored copy of the source"
      text: "Each statement is drawn from a document we hold a stored copy of. For this report that is Great Eastern's Annual Report 2025, as published in March 2026. We record the page on which each statement appears."
    - head: "Quotations are matched word for word"
      text: "Every quotation is compared with the text of the stored copy, on the page cited, and is printed only if it matches word for word. Where a quotation is shortened, an ellipsis marks the gap and each remaining part is matched in order."
    - head: "Status uses the company's own wording"
      text: "Where we say how far a use of AI has progressed, we use the company's verb, such as \"deployed\", \"testing\" or \"developed\". A stated aim is never presented as a result."
    - head: "Figures from tables are read from the stored copy"
      text: "Figures taken from tables, such as the assumption sensitivities in section {sec:value}, are read from the stored copy each time the report is produced and checked against the values we expect; any total is recalculated from them."
    - head: "Our sentences are kept apart from the company's"
      text: "Summary sentences, observations and hypotheses are ours. Each cites the pages it rests on and is checked against those pages for dropped qualifiers, such as \"aims to\", before release."
    - head: "Absence is reported as a search, not a finding"
      text: "Where we say the report does not describe something, we state what we searched for, where, and what the search cannot show (section {sec:governance})."
    - head: "Later material is kept separate"
      when: full
      text: "Material we have located but not yet checked against a stored copy appears only in section {sec:developments}, phrased as reported by its source and marked to be confirmed."
    - head: "Independent review before release"
      text: "Before a report is final, its findings are reviewed by an advisor who did not produce them. This discussion draft has not yet completed that review."

