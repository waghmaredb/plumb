    - great-eastern.findings.q.testing.3
    - great-eastern.findings.q.governance
    - great-eastern.findings.q.group
    - great-eastern.findings.q.opmodel
    - great-eastern.findings.q.successor
  - type: phases
    head: "How the assessment would run"
    intro: "A 12-day assessment would test the three hypotheses with the leadership team. No confidential data is needed for the first phase."
    storyline: proposal

# --------------------------------------------------------------------------- appendices
- id: sources
  kind: appendix
  letter: A
  title: Sources
  blocks:
  - type: sources
    head_main: "Documents relied on in this report"
    page_note: "Page numbers are those printed on the pages of the annual report. A page without a printed number would be cited by its position in the PDF file."
    head_awaiting: "Documents referred to as awaiting source check"
    awaiting_note: "Located at each publisher's website and read once; not yet checked against a stored copy. The web address of each is printed beside the item in section {sec:developments}. Nothing in sections 1 to 4 relies on them."

- id: method
  kind: appendix
  letter: B
  title: Method
  blocks:
  - type: para
    text: "This report is built so that every statement can be traced to the page it comes from. The steps below apply to every quotation and every summary sentence in it."
  - type: method
    items:
    - head: "Statements start from a stored copy of the source"
      text: "Each statement is drawn from a document we hold a stored copy of. For this report that is Great Eastern's Annual Report 2025, as published in March 2026. We record the page on which each statement appears."
    - head: "Quotations are matched word for word"
      text: "Every quotation is compared with the text of the stored copy, on the page cited, and is printed only if it matches word for word. Where a quotation is shortened, an ellipsis marks the gap and each remaining part is matched in order."
    - head: "Status uses the company's own wording"
      text: "Where we say how far a use of AI has progressed, we use the company's verb, such as \"deployed\", \"testing\" or \"developed\". A stated aim is never presented as a result."
    - head: "Our sentences are kept apart from the company's"
      text: "Summary sentences, observations and hypotheses are ours. Each cites the pages it rests on and is checked against those pages for dropped qualifiers, such as \"aims to\", before release."
    - head: "Absence is reported as a search, not a finding"
      text: "Where we say the report does not describe something, we state what we searched for, where, and what the search cannot show (section {sec:governance})."
    - head: "Later material is kept separate"
      when: full
      text: "Material we have located but not yet checked against a stored copy appears only in section {sec:developments}, phrased as reported by its source and marked to be confirmed."
    - head: "Independent review before release"
      text: "Before a report is final, its findings are reviewed by an advisor who did not produce them. This discussion draft has not yet completed that review."

- id: open-items
  kind: appendix
  letter: C
  title: Open items
  blocks:
  - type: para
    text: "The items below could not be confirmed for this draft. None of them is relied on in the body of the report."
  - type: open_items
    items:
    - head: "Peer size comparison"
      text: "Total-asset figures for four peers (AIA Group, Prudential Assurance Company Singapore, Income Insurance and Singlife) could not be checked, because the published files could not be retrieved when we checked."
      next: "Retrieve the regulator's insurer returns and the peers' annual reports, then check each figure."
      accounts_for:
      - great-eastern.peer.size.prudential-assurance-co-singapore-i527l
      - great-eastern.peer.size.income-insurance-ltd-i585c
      - great-eastern.peer.size.singapore-life-ltd-singlife-i518c
      - great-eastern.peer.size.aia-group-whole
    - head: "MAS guidelines on AI risk management"
      when: full
      text: "The regulator's guidelines could not be retrieved into a stored copy, so their dates and expectations appear only in section {sec:developments}, to be confirmed."
      next: "Store the guidelines and media release, and check the dates and paragraphs cited."
      accounts_for: &mas
      - great-eastern.findings.reg.sg-mas-airm.issued
      - great-eastern.findings.reg.sg-mas-airm.effective
      - great-eastern.findings.reg.sg-mas-airm.lifecycle
    - head: "Regulatory developments"
      when: strict
      text: "Regulatory guidance on AI risk management issued after March 2026 has not yet been checked against a stored copy and is not covered in this edition."
      next: "Store the regulator's documents and check them before discussion."
