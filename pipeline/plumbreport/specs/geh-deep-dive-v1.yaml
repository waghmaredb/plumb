    - head: "Developments since March 2026"
      text: "Half-year results, annual general meeting materials and board announcements published since the annual report have not yet been checked against stored copies."
      next: "Store each document and re-read the passages concerned."
    - head: "Copy of the annual report"
      text: "The copy of the annual report used was supplied as a file. It has not yet been matched against the copy on Great Eastern's website. Every quotation in this report has been matched against the supplied copy."
      next: "Compare the supplied file with the publisher's copy; any difference will be reported."
