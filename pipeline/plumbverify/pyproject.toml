[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plumbverify"
version = "0.3.0"
description = "PLUMB verification layer: citation, claim and quotation verification with block-not-flag enforcement and hash-chained logging (spec PI-CV v0.1)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.5",
    "rapidfuzz>=3.0",
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0",
    "pypdf>=4.0",
]

[project.optional-dependencies]
extract = ["trafilatura>=1.8"]
pdf-fallback = ["pdfminer.six>=20231228"]
test = ["pytest>=7.4"]

[project.scripts]
plumbverify = "plumbverify.cli:main"

[tool.setuptools]
packages = ["plumbverify"]

[tool.setuptools.package-data]
plumbverify = ["tiers.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
