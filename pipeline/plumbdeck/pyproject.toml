[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plumbdeck"
version = "0.1.0"
description = "PLUMB deck exporter: renders the ghost-deck storyline from plumbresearch run outputs to Markdown and PPTX, with the S02 verification-statement interlock (ghost deck R8/R9, pipeline S8)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "python-pptx>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.scripts]
plumbdeck = "plumbdeck.cli:main"

[tool.setuptools]
packages = ["plumbdeck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
