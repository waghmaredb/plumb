  # ------------------------------------------------------------------ job postings (D4.1)
  - id: mcf-api-search
    local_file: postings/mcf-great-eastern-page-{n}.json
    url: "https://api.mycareersfuture.gov.sg/v2/search?limit=50&page={n}"
    content_type: application/json
    purpose: "MyCareersFuture search API: POST JSON {\"search\":\"great eastern\"} with Content-Type/Accept application/json and a UA. Response has `total` and `results[]` with metadata.jobDetailsUrl, postedCompany, title, description, metadata.newPostingDate. limit 1–50, page 0–50. Usable from a laptop with plain curl; the HTML site is client-rendered."
    module: postings
    instrument_items: [D4.1]
    verify: url_confirmed
    notes: "Endpoint shape taken from two independent open-source clients (pwaaron/jobscrapers notebook; gabrielchua/mcf-mcp). Live only shows CURRENT postings — the 24-month series needs repeated snapshots or a historical source; record snapshot date in postings.csv `source`."
