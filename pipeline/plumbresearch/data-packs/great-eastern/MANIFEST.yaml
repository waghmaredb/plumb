# PLUMB alpha — Great Eastern Holdings data pack manifest
# Scouted 2026-10-25 from a sandbox with blocked egress: every URL below was located by
# WebSearch and probed with WebFetch (a model summary of the page, NOT evidence). Nothing here
# has been hashed. `fetch-datapack.sh` downloads each item on a laptop with normal egress, writes
# SHA-256 sums, and the pipeline then serves the local file under the declared URL
# (LocalDocTransport) so the citation of record stays the URL.
#
# verify flags:
#   url_confirmed  — WebFetch returned the document's own content (text or "[binary data]" for a PDF/XLSX)
#   url_inferred   — URL built from a sibling's pattern; WebFetch could not reach it (MAS rate-limited)
#   figure_verify  — figure read from a WebFetch summary; must be re-read from the hashed file
#   proxy_by_parent — OCBC material standing in for GEH (must be labelled in every output)
subject: great-eastern
scouted: 2026-10-25
data_dir: data/great-eastern            # relative to pipeline/plumbresearch, matches `--data-dir data`
sandbox_note: "curl to greateasternlife.com, mas.gov.sg, links.sgx.com → CONNECT 403 from the sandbox proxy; all fetching happens on the laptop."

items:
  # ------------------------------------------------------------------ subject primary documents (D1.1)
