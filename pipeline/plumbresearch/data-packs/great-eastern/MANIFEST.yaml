    notes: "WebFetch returned full text: 'Annual Report 2025', ≥232 pages (Notice of AGM at p.232), total assets S$122,639.1m, profit attributable S$1,207.1m, ~19 'AI' mentions (approximate). Replaces the links.sgx.com URL (403 from sandbox) and the 20260327-ar-fy2025-announcement.pdf wrapper."
