# §7 Inter-rater reliability test subset (κ)
kappa:
  items_count: 20
  selection: "chosen to cover every dimension and all four evidence classes, weighted toward items most dependent on judgement"
  design: "Two assessors score independently from the same evidence pack for ≥10 organisations (≥200 paired ratings)"
  statistic: "Quadratic-weighted Cohen's κ per item (ordinal scale); plus exact-agreement %"
  thresholds:
    accept: 0.70
    rewrite_anchors_low: 0.50
    rules: "κw ≥ 0.70 accept; 0.50–0.69 rewrite anchors; <0.50 rewrite or drop item"
  exit_criterion_v0_2: "≥16 of 20 items at κw ≥ 0.70, no item <0.50"
  exit_min_items_accept: 16
  subset: [D1.1, D1.3, D1.5, D2.3, D2.5, D3.2, D3.5, D4.1, D4.4, D5.1, D5.4, D5.5, D6.1, D6.2, D6.4, D6.6, D7.2, D7.3, D8.2, D8.4]

