    evidence_class_required_text: "D (decision records)"
    kappa_subset: false
    outside_in_proxies:
      - {signal: "Announced discontinuations or portfolio pruning", validation: "No published validation"}
  - id: D8.6
    dimension: D8
    question: "Do you know the full cost of running AI?"
    anchors:
      1: "Unknown"
      2: "Build cost only"
      3: "3-year TCO including run and token costs per use case"
      4: "Unit economics monitored (cost per transaction or outcome)"
      5: "Cost per outcome benchmarked and optimised (e.g. model routing)"
    evidence_class_required: [S]
    evidence_class_required_text: "S (cost dashboard)"
    kappa_subset: false
    outside_in_proxies:
      - {signal: "Commentary on AI run costs / token spend in results calls", validation: "[P2] notes AI bought as opex; no capex signal"}

# §4 Value axis (reported separately; never merged into the capability score)
value_axis:
  output_format: "a four-cell profile (e.g. \"V1 B · V2 40–61% · V3 4 · V4 2\") displayed beside the capability band"
  value_gap_flag: "raised when capability band is Scaling or Leading but V1 = Band A or V3 ≤ 2"
  items:
    - id: V1
      question: "What share of EBIT in the last fiscal year is attributable to AI, under a finance-approved attribution rule?"
      scale_type: band
      scale: ["A", "B", "C"]
      scale_labels: {A: "none / not measured", B: ">0 and <5%", C: "≥5%"}
      evidence_required: "S (finance extract) + D (attribution rule, with the D8.4 organisation item score ≥3 in the evidenced view); otherwise recorded as Band A \"not evidenced\""
      evidence_class_required: [S, D]
      unevidenced_value: "A"
      unevidenced_label: "not evidenced"
      dependency: {item: D8.4, min_level: 3}
      calibration_anchor: "McKinsey high performers = >5% EBIT + significant value ≈ 6% of respondents; 39% attribute any EBIT impact, most <5% [S4]"
      note: "v0.2 decision 10: kept, and documented as the instrument's only cross-item dependency. The scorer checks the D8.4 organisation item score (median of capped responses) ≥3."
    - id: V2
      question: "Of AI initiatives started in the last 24 months, what share is in production (live, owned, with users)?"
      scale_type: band
      scale: ["<12%", "12–39%", "40–61%", "≥62%"]
      evidence_required: "S (portfolio tracker); self-report capped at the 12–39% band"
      evidence_class_required: [S]
      self_report_cap: "12–39%"
      calibration_anchor: "BCG future-built 62% deployed vs 12% laggards [S1]; Gartner high-maturity 45% of projects ≥3 yrs in production [S5]"
      share_intervals:
        - {code: "<12%", low: null, high: 12, high_inclusive: false}
        - {code: "12–39%", low: 12, low_inclusive: true, high: 39, high_inclusive: true}
        - {code: "40–61%", low: 39, low_inclusive: false, high: 61, high_inclusive: true}
        - {code: "≥62%", low: 61, low_inclusive: false, high: null}
      note: "v0.2 decision 8: upper-inclusive edges on the unrounded share p: p < 12 · 12 ≤ p ≤ 39 · 39 < p ≤ 61 · p > 61. Band codes unchanged; a numeric share in the responses CSV is mapped to its band code."
    - id: V3
      question: "How rigorous is value tracking?"
      scale_type: level
      scale: [1, 2, 3, 4, 5]
      scale_labels:
        1: "none"
        2: "anecdotal"
        3: "self-reported metric per use case"
        4: "system-measured baseline, finance-reconciled"
        5: "control groups + finance sign-off + audit trail"
      evidence_required: "S (ledger) for ≥4"
      evidence_class_required: [S]
      self_report_cap: 3
      calibration_anchor: "BCG >60% of future-built rigorously track vs 17% of stagnating [S1]; PwC leaders 80% more likely to systematically track [S8]; DBS three-bucket, control-group model [P12]"
    - id: V4
      question: "What is your agent control maturity?"
      scale_type: level
      scale: [0, 1, 2, 3, 4]
      scale_labels: "OWASP Governance Maturity Level 0–4 on the full GML ladder (governance and technical controls together; D6.6 and D3.5 each score one half of it as capability items, V4 records the whole as an outcome and is assessed on its own evidence, with no scoring dependency on either item)"
      evidence_required: "O (kill-switch test) + S (logs) for ≥3"
      evidence_class_required: [O, S]
      self_report_cap: 2
      calibration_anchor: "Deloitte: 20% mature agent governance [S7]; BCG: 5% have the full control set for agents with decision authority [P11]"
      note: "GML n corresponds to level n+1 on D6.6 and D3.5, so the V4 cap at 2 is consistent with the level-3 cap on both items."

# §7 Inter-rater reliability test subset (κ)
kappa:
  items_count: 20
  selection: "chosen to cover every dimension and all four evidence classes, weighted toward items most dependent on judgement"
  design: "Two assessors score independently from the same evidence pack for ≥10 organisations (≥200 paired ratings)"
  statistic: "Quadratic-weighted Cohen's κ per item (ordinal scale); plus exact-agreement %"
  thresholds:
    accept: 0.70
    rewrite_anchors_low: 0.50
    rules: "κw ≥ 0.70 accept; 0.50–0.69 rewrite anchors; <0.50 rewrite or drop item"
  exit_criterion_v0_3: "≥16 of 20 items at κw ≥ 0.70, no item <0.50 (v0.2 resolved scoring ambiguities only; it did not run the κ test)"
  exit_min_items_accept: 16
  subset: [D1.1, D1.3, D1.5, D2.3, D2.5, D3.2, D3.5, D4.1, D4.4, D5.1, D5.4, D5.5, D6.1, D6.2, D6.4, D6.6, D7.2, D7.3, D8.2, D8.4]

