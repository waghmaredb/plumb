# §5.6 Decisions resolved in v0.2 (one per ambiguity logged by the v0.1 transcription)
decisions_v0_2:
  - {id: 1, topic: "Band edges", decision: "Upper-inclusive closed intervals on the unrounded score: Stagnating ≤25 · Emerging >25–≤50 · Scaling >50–≤75 · Leading >75; \"Leading (≥76)\" corrected to >75", rationale: "Matches the worked check (50.0 = top of Emerging) and leaves no score unassigned", v0_1_interim: "Upper-inclusive edges", changed_scoring: false}
  - {id: 2, topic: "Cap scope", decision: "Per response, before aggregation", rationale: "The web form has no consensus to cap; one rule for both channels, and the stricter one", v0_1_interim: "Per response", changed_scoring: false}
  - {id: 3, topic: "Organisation item score", decision: "Median of capped responses; mean shown as secondary", rationale: "Robust to a few enthusiasts or sceptics in a group of 10–30; the mean–median gap remains visible", v0_1_interim: "Mean of capped rows", changed_scoring: true}
  - {id: 4, topic: "Proxy count", decision: "Kept as written; 1–4 per item; the 10 single-proxy items marked †; D8.1/D8.2 shared row split", rationale: "States what exists rather than promising proxies no source yet supports", v0_1_interim: "As written", changed_scoring: false}
  - {id: 5, topic: "D4.4 evidence", decision: "Follow the Ev≥4 column, I (≥2) + O; §7 text corrected", rationale: "The anchor's L4 (\"observable\" tool use) needs observation, not interviews alone", v0_1_interim: "Follow the Ev≥4 column", changed_scoring: false}
  - {id: 6, topic: "Percentile ties", decision: "Mid-rank: 100 × (below + 0.5 × equal) / n", rationale: "Tied organisations get one value and the statistic is symmetric", v0_1_interim: "Mid-rank", changed_scoring: false}
  - {id: 7, topic: "Region", decision: "Optional peer filter; required field in every benchmark row", rationale: "Most SG/APAC peer sets fall below n = 15 with region applied, but the field must exist to apply it later", v0_1_interim: "Region optional", changed_scoring: false}
  - {id: 8, topic: "V2 edges", decision: "Upper-inclusive on the unrounded share: p < 12 · 12 ≤ p ≤ 39 · 39 < p ≤ 61 · p > 61", rationale: "Same convention as the capability bands; band codes and labels unchanged", v0_1_interim: "Upper-inclusive", changed_scoring: false}
  - {id: 9, topic: "Band target shares", decision: "15 / 45 / 32.5 / 7.5 = 100%; BCG reference restated in band order as 14 / 46 / 35 / 5", rationale: "Shares must sum to 100% and be read in the same order as the bands", v0_1_interim: "Fix text", changed_scoring: false}
  - {id: 10, topic: "V1 ↔ D8.4", decision: "Kept: V1 counts as evidenced only if the D8.4 organisation item score (evidenced view) is ≥3; the instrument's only cross-item dependency", rationale: "An EBIT share without a documented attribution rule is not evidence of value", v0_1_interim: "Implemented as stated (on the D8.4 mean)", changed_scoring: true}
  - {id: 11, topic: "I (≥2)", decision: "Two interview references (or an interviewees count ≥2) must be visible in the evidence rows before the I class counts", rationale: "Makes the \"two independent interviewees\" rule checkable rather than an attestation", v0_1_interim: "Assessor attestation", changed_scoring: true}
  - {id: 12, topic: "D3.5 vs D6.6", decision: "Both kept, not merged. D6.6 = governance of agents (policy, accountable executive, register, approval tiers); D3.5 = technical controls (identity, credentials, logging, sandbox, kill switch); anchors rewritten so no control appears in both", rationale: "Each half of the OWASP ladder is scored once, so agent controls are no longer double-counted", v0_1_interim: "Scored separately", changed_scoring: true}
