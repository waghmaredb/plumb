# PLUMB Enterprise AI Maturity Instrument v0.2 — machine-readable transcription
# Source of truth: ../methodology/maturity-instrument.md (v0.2, 2026-10-25).
# This file is a faithful transcription. v0.2 resolves the 12 ambiguities the
# v0.1 transcription logged; each is recorded under `decisions_v0_2` (md §5.6)
# and applied in the fields below. instrument-v0.1.yaml is kept for history.

instrument:
  name: "Enterprise AI Maturity Instrument"
  version: "0.2"
  status: "v0.2 draft — the 12 scorer ambiguities resolved by decision (§5.6); anchors not yet κ-tested (§7)"
  owner: "Methodology"
  classification: "Firm IP, shareable with clients under engagement terms"
  date: "2026-10-25"
  source_markdown: "methodology/maturity-instrument.md"
  purpose: >-
    A two-axis, evidence-gated maturity score (capability 0–100 in four bands;
    value axis reported separately, never merged) with published anchors,
    published weights, perception-variance output and peer percentile.

# §1 Structure at a glance
structure:
  capability_axis: "8 dimensions × 6 items = 48 items, each 5 anchored levels (1–5)"
  value_axis: "4 items (V1–V4), reported as a profile beside the capability score, never averaged into it"
  outside_in_proxies: "1–4 per item (the 10 single-proxy items are marked † in §3); corroborate only, never lift a score (§5.4)"
  single_proxy_items: [D1.6, D4.5, D4.6, D5.1, D8.1, D8.2, D8.3, D8.4, D8.5, D8.6]
  organisation_item_score: "Median of the respondents' capped responses; the mean is shown beside it as a secondary statistic (v0.2 decision 3, §5.1)"
  scorecard_views: "self-view (median of raw self-reports, uncapped) and evidenced view (median of capped responses) side by side; the evidenced view is the score of record"
  output: "Weighted 0–100 capability score and band (self-view and evidenced view); value-axis profile; per-item σ with flags; peer percentile with n disclosed where the peer set has n ≥ 15 within one population, otherwise rank within named peers (§5.5); evidence coverage %"

level_semantics:
  1: "absent"
  2: "ad hoc / pilot"
  3: "in production with owner, budget, controls (production boundary)"
  4: "scaled, measured, standardised"
  5: "embedded in decisions/products, externally evidenced or independently assured"

evidence_classes:
  D: "document (policy, board paper, assessment report)"
  S: "system record (logs, dashboards, HRIS/LMS/finance extracts, inventory)"
  I: "interview (≥2 independent interviewees agree; counts only when verifiable from the evidence rows as ≥2 distinct interview references or an interviewee count ≥2, §5.4)"
  O: "observation (assessor sees the system, workflow or artefact live)"
evidence_class_rule: >-
  The class listed per item is the minimum required to score 4 or 5. Where two
  are listed (e.g. "D+S"), both are required.

# §5 Scoring specification
scoring:
  item_scale: {min: 1, max: 5}
  response_score_rule: "Integer 1–5 per respondent per item, after the cap rule (§5.4), which is applied to each response before any aggregation (v0.2 decision 2)"
  organisation_item_score:
    statistic: median
    secondary: mean
    rule: >-
      Median of the capped responses for the item (with an even number of
      responses, the midpoint of the two middle values, so half-levels such as
      2.5 occur); the mean of the capped responses is reported beside it as a
      secondary statistic and never used in the total (v0.2 decision 3).
      Assessor adjustment applies to the organisation item score.
    rationale: "Robust to a few enthusiasts or sceptics in a group of 10–30 respondents; the mean–median gap remains visible"
  self_view_rule: "The same steps run on the raw (uncapped) responses give the self-view score; the evidenced view is the score of record"
  dimension_items: 6
  dimension_min_items_scored: 4
  dimension_not_scored_rule: >-
    requires ≥4 of 6 items scored (an item is scored when it has at least one
    response), otherwise dimension marked "not scored" and its weight
    renormalised across scored dimensions, with a flag on the output
  dimension_score_formula: "s_d = (m_d − 1) / 4 × 100"
  capability_formula: "C = Σ w_d × s_d / 100"
  rounding: "Report C to one decimal; band assigned on the unrounded value"
  worked_check: "all 48 items at level 3 → every organisation item score = 3 → every s_d = 50 → C = 50.0 → top of Emerging"
  leading_requires_weighted_mean_above: 4.0
  leading_note: "Leading (C > 75) requires a weighted dimension mean above 4.0; all items at exactly 4 give C = 75.0, the top of Scaling"

  # §5.4 Evidence cap rule
  cap_rule:
    self_report_cap: 3
    scope: per_response
    cap: >-
      Applied per response (v0.2 decision 2): any respondent's self-report of 4
      or 5 on an item is recorded at 3 unless an artefact of the item's Ev≥4
      class is logged against that response in the evidence register with an
      artefact ID, date and reviewer. Where two classes are listed (e.g.
      "D+S"), both must be logged. The organisation item score is then the
      median of the recorded responses (§5.1)
    lift: >-
      With the required artefact logged, the response is scored at the level
      the artefact supports (which may be below the self-report)
    interview_evidence: >-
      Where Ev≥4 is D or S, interview agreement alone lifts to at most 3. Where
      Ev≥4 includes I (D4.4, D7.2, D7.3), the I class counts only when two
      independent interviewees are verifiable from the evidence rows (v0.2
      decision 11): either ≥2 distinct interview references are logged on the
      item's rows, or a row's `interviewees` count is ≥2. A single interview
      reference does not lift and does not count toward evidence coverage
    interview_min_independent: 2
    outside_in_signals: >-
      Corroborate only. A proxy can be cited to challenge a self-report
      downward or to pre-populate a draft score, never to lift above 3
    down_scoring: >-
      Assessor may score below self-report at any level with a written reason;
      the respondent median and assessor score are both retained
    evidence_coverage_rule: >-
      Deliverable reports % of items with qualifying evidence logged;
      engagements below 60% coverage report the capability score as
      "self-report-dominant"
    evidence_coverage_self_report_dominant_below: 0.60

  # §5.3 Leadership-perception variance
  variance:
    respondents_range: "10–30 leaders per organisation"
    min_respondents_for_sigma: 5
    below_min_rule: "below 5, report min–max range instead of σ"
    sigma_type: "population standard deviation of raw self-reported levels across respondents"
    computed_before_cap: true
    sigma_flag_threshold: 1.0
    sigma_flag_label: "perception divergence"
    sigma_flag_output: "item listed in the deliverable with the respondent roles at each extreme (roles, not names)"
    alignment_index: "Share of items in the dimension flagged"
    alignment_not_aligned_share: 0.50
    alignment_not_aligned_label: "leadership not aligned"
    exco_gap: "mean(ExCo respondents) − mean(operating-manager respondents) per dimension"
    exco_gap_flag_abs: 0.75
    exco_gap_sign_labels: {positive: "ExCo-optimistic", negative: "ExCo-pessimistic"}

  # §5.5 Peer percentile
  peer_percentile:
    peer_set: "Industry × size band, with region (APAC sub-region) as an optional third filter; built by the documented peer-set funnel used in Phase 1"
    region_filter: optional
    region_required_in_benchmark_rows: true
    min_n: 15
    fallback: "report the rank within the named peers with each peer's value shown, labelled \"global, peer n insufficient\", and no percentile"
    fallback_label: "global, peer n insufficient"
    percentile: "Mid-rank percentile of C within the set (v0.2 decision 6): 100 × (number below + 0.5 × number equal) / n; also reported per dimension and for V2/V3"
    tie_rule: mid_rank
    populations: "Tier-0 self-scored entries (population = self) and evidence-gated engagement entries (population = evidenced) are never pooled into one percentile"
    disclosure: "n, peer-set definition date and the share of peer entries that are evidence-gated vs self-scored only (free instrument entries) are printed on the scorecard"

# §5.2 Bands
bands:
  production_boundary: 50
  edges: "upper-inclusive closed intervals on the unrounded score (v0.2 decision 1): 0 ≤ C ≤ 25 · 25 < C ≤ 50 · 50 < C ≤ 75 · 75 < C ≤ 100"
  threshold_policy: "Thresholds are fixed for v0.2; after n≥100 benchmark entries, thresholds (not anchors) are adjusted so Leading = 5–10%"
  target_shares_sum: "15 + 45 + 32.5 + 7.5 = 100% (v0.2 decision 9); Leading window 5–10%, Scaling the complement within the top 40% (30–35%)"
  target_share_reference: "BCG 2025 distribution, in band order Stagnating → Leading: 14 / 46 / 35 / 5; IDC 2026 finding that 61.3% sit in the bottom two stages"
  recalibration_limit: "Any configuration that places >15% of the benchmark in Leading is out of line with every published source and must be re-calibrated"
  # low is exclusive except for the first band; high is inclusive.
  list:
    - {name: "Stagnating", low: 0, high: 25, interval: "0 ≤ C ≤ 25", meaning: "Mostly absent or ad hoc; no production AI with an owner", target_share: "15%"}
    - {name: "Emerging", low: 25, high: 50, interval: "25 < C ≤ 50", meaning: "Pilots and first production systems; controls and value tracking partial", target_share: "45%"}
    - {name: "Scaling", low: 50, high: 75, interval: "50 < C ≤ 75", meaning: "Majority of items above the production boundary; standardised methods and measurement", target_share: "32.5% (window 30–35%)"}
    - {name: "Leading", low: 75, high: 100, interval: "75 < C ≤ 100", meaning: "Embedded in decisions and products, independently evidenced", target_share: "7.5% (window 5–10%)"}

# §2 Capability axis: dimensions and weights
dimensions:
  - id: D1
    name: "Strategy & ambition"
    weight: 10
    justification: "Necessary but widely \"highly prepared\" already (Deloitte: 42% rate strategy highly prepared); IDC: \"strategy is outpacing delivery\" [S6]"
  - id: D2
    name: "Data foundations"
    weight: 12
    justification: "Bain tracks data unreadiness as the growing roadblock; Accenture DM&G is a core capability [S3]"
  - id: D3
    name: "Technology & platform (incl. LLMOps/agent infra)"
    weight: 12
    justification: "Held below people/process weights deliberately; 2021 review found technology over-weighted at 46% of model attention [S10]"
  - id: D4
    name: "Talent & skills"
    weight: 10
    justification: "Accenture front-runners show 4x talent maturity; part of the \"70% people/process\" effort share [S3][S1]"
  - id: D5
    name: "Operating model & workflow redesign"
    weight: 14
    justification: "Strongest single discriminator: McKinsey high performers 2.8x as likely to have redesigned workflows (55% vs 20%) [S4]"
  - id: D6
    name: "Governance, risk & compliance"
    weight: 16
    justification: "IDC split governance into its own dimension in 2026; MAS AIRG makes it regulatory for FIs from Oct 2027; only 20% have mature agent governance [S6][S14][S7]"
  - id: D7
    name: "Culture & adoption"
    weight: 10
    justification: "Gartner: BU trust 57% vs 14% between high and low maturity; completes the 70% people/process share with D4+D5 [S5]"
  - id: D8
    name: "Value management"
    weight: 16
    justification: "Outcome-anchored cuts (McKinsey >5% EBIT; PwC top 20%) are the only ones tied to financials; BCG future-built >60% rigorously track value vs 17% of stagnating [S4][S8][S1]"
weights_total: 100
weights_check: "D4+D5+D7 = 34; D6+D8 = 32; D2+D3 = 24; D1 = 10"
weights_status: "a priori (set in v0.1, unchanged in v0.2); to be re-fitted once the benchmark holds n≥100 scored organisations with an independent outcome measure (value axis V1–V3)"

# §3 Capability items
# evidence_class_required: set of classes ALL required to score 4 or 5 (from the Ev≥4 column).
# evidence_class_required_text: the Ev≥4 column verbatim.
items:
  # ---------------- D1 Strategy & ambition ----------------
  - id: D1.1
    dimension: D1
    question: "Which statement best describes your organisation's AI ambition?"
    anchors:
      1: "No written AI ambition; AI appears only in IT plans"
      2: "AI referenced in corporate strategy without targets or timeline"
      3: "Approved AI strategy naming priority use cases and a 12-month plan, with a named sponsor"
      4: "Multi-year (≥3 yr) ambition with quantified financial targets, reviewed by the board at least annually"
      5: "AI targets disclosed in investor materials or external guidance and linked to executive remuneration"
    evidence_class_required: [D]
    evidence_class_required_text: "D (board paper / strategy doc)"
    kappa_subset: true
    kappa_reason: "Distinguishing \"strategy\" from \"ambition with targets\" is judgement-heavy"
    outside_in_proxies:
      - {signal: "Annual report / 10-K AI paragraph scored on the 1–5 Yu et al. rubric (L1 mention → L5 deep integration)", validation: "[P2] sector corr. 0.76 with Census, 0.87 with Ramp; [P3] AIR Index"}
      - {signal: "investor-day AI targets", validation: "[P2] sector corr. 0.76 with Census, 0.87 with Ramp; [P3] AIR Index"}
      - {signal: "earnings-call AI semantic density", validation: "[P2] sector corr. 0.76 with Census, 0.87 with Ramp; [P3] AIR Index"}
  - id: D1.2
    dimension: D1
    question: "Who is accountable for AI outcomes at the top of the organisation?"
    anchors:
      1: "No one named"
      2: "An IT or digital lead by default, no mandate letter"
      3: "A named executive owner of AI in role ≥6 months with written mandate"
      4: "Chief AI Officer or equivalent reporting to CEO/COO, with budget authority and a central team"
      5: "CAIO plus every BU head carrying AI targets in their scorecard"
    evidence_class_required: [D]
    evidence_class_required_text: "D (org chart + mandate)"
    kappa_subset: false
    outside_in_proxies:
      - {signal: "CAIO/CDO on leadership page or LinkedIn", validation: "[P4] future-built 3x as likely to have CAIO, 2x CDO; [P5] 91% of high-maturity orgs have dedicated AI leaders"}
      - {signal: "reporting line stated in announcements", validation: "[P4] future-built 3x as likely to have CAIO, 2x CDO; [P5] 91% of high-maturity orgs have dedicated AI leaders"}
      - {signal: "tenure", validation: "[P4] future-built 3x as likely to have CAIO, 2x CDO; [P5] 91% of high-maturity orgs have dedicated AI leaders"}
  - id: D1.3
    dimension: D1
    question: "How is the AI portfolio focused?"
    anchors:
      1: "No portfolio view exists"
      2: ">15 unconnected use cases, no prioritisation record"
      3: "Prioritised use-case list with an owner per item"
      4: "2–5 defined domains, each with a sized value pool and domain owner"
      5: "Portfolio rebalanced at least quarterly on realised value; kill decisions recorded"
    evidence_class_required: [D]
    evidence_class_required_text: "D (portfolio register)"
    kappa_subset: true
    kappa_reason: "Domain focus vs use-case scatter"
    outside_in_proxies:
      - {signal: "Count of distinct AI initiatives named in press releases over 12 months (scatter vs focus)", validation: "BCG AI Radar: leaders prioritise ~3.5 use cases vs 6.1 [P10]; no firm-level validation"}
      - {signal: "recurrence of the same 2–5 themes", validation: "BCG AI Radar: leaders prioritise ~3.5 use cases vs 6.1 [P10]; no firm-level validation"}
  - id: D1.4
    dimension: D1
    question: "How is AI funded?"
    anchors:
      1: "No dedicated budget"
      2: "Funded project-by-project from BU discretionary budgets"
      3: "Annual AI budget line approved centrally"
      4: "Multi-year funding with stage gates and documented reallocation between initiatives"
      5: "AI investment share at or above peer top quartile and disclosed"
    evidence_class_required: [D, S]
    evidence_class_required_text: "D+S (budget record)"
    kappa_subset: false
    outside_in_proxies:
      - {signal: "Disclosed AI spend or share of IT budget", validation: "[P4] avg ~5% of IT budget (APAC 5.2%); [P6] leaders invest 2.5x more of revenue"}
      - {signal: "capex/opex commentary on AI in results calls", validation: "[P4] avg ~5% of IT budget (APAC 5.2%); [P6] leaders invest 2.5x more of revenue"}
  - id: D1.5
    dimension: D1
    question: "Where does AI sit in your products and services?"
    anchors:
      1: "Not in any customer offering"
      2: "Discussed or prototyped, nothing live"
      3: "At least one AI-enabled feature live in a customer-facing offering"
      4: "AI features priced, measured and roadmapped across ≥2 product lines"
      5: "AI capabilities sold as services or embedded in all core decisions (MIT CISR Stage 4 marker)"
    evidence_class_required: [O, D]
    evidence_class_required_text: "O (live product) + D"
    kappa_subset: true
    kappa_reason: "Live product boundary (O evidence)"
    outside_in_proxies:
      - {signal: "AI features in product pages", validation: "[P1] growth via product innovation (trademarks, product patents); [P4] 3.5x patents"}
      - {signal: "trademarks and product patents", validation: "[P1] growth via product innovation (trademarks, product patents); [P4] 3.5x patents"}
      - {signal: "app-store release notes", validation: "[P1] growth via product innovation (trademarks, product patents); [P4] 3.5x patents"}
  - id: D1.6
    dimension: D1
    question: "How does the AI roadmap connect to financial plans?"
    anchors:
      1: "No roadmap"
      2: "Roadmap with no value attached"
      3: "Roadmap items with owners, dates and a stated expected benefit"
      4: "Every roadmap item tied to a P&L line on a driver tree"
      5: "Roadmap reforecast quarterly against realised value with finance sign-off"
    evidence_class_required: [D, S]
    evidence_class_required_text: "D (roadmap) + S (finance)"
    kappa_subset: false
    outside_in_proxies:
      - {signal: "Quantified AI-attributed financials in guidance or results (e.g. \"5–10% of FY EBIT\")", validation: "[P2] rubric L4 = \"expected financial outcomes\"; [P3]"}

  # ---------------- D2 Data foundations ----------------
  - id: D2.1
    dimension: D2
    question: "Who owns your critical data?"
    anchors:
      1: "No named owners"
      2: "IT owns data by default"
      3: "Named business data owners for the priority AI domains"
      4: "Enterprise data-owner register with stewardship SLAs covering all critical data domains"
      5: "Data-ownership KPIs in executive scorecards and reviewed quarterly"
    evidence_class_required: [D]
    evidence_class_required_text: "D (register)"
    kappa_subset: false
    outside_in_proxies:
      - {signal: "CDO presence", validation: "[P4] future-built 2x as likely to have a CDO"}
      - {signal: "data-governance titles on LinkedIn", validation: "[P4] future-built 2x as likely to have a CDO"}
  - id: D2.2
    dimension: D2
    question: "How is data quality measured?"
    anchors:
      1: "Not measured"
      2: "Checked manually when problems arise"
      3: "Quality rules monitored for datasets feeding production AI"
      4: "Quality dashboards with thresholds, alerts and a data-incident process"
      5: "Quality SLAs enforced contractually, including with external data suppliers"
    evidence_class_required: [S]
    evidence_class_required_text: "S (dashboard / incident log)"
    kappa_subset: false
    outside_in_proxies:
      - {signal: "Job postings for data-quality / data-steward roles", validation: "[P1] postings method; no quality-specific validation"}
      - {signal: "data-quality tooling in technographics", validation: "[P1] postings method; no quality-specific validation"}
  - id: D2.3
    dimension: D2
    question: "How accessible is governed data?"
    anchors:
      1: "Silos; extracts by request"
      2: "Partial warehouse/lake, no catalogue"
      3: "Governed catalogue covering priority domains with access workflow"
      4: "Self-serve access with lineage for >70% of critical datasets"
      5: "Proprietary \"flow\" data products generated continuously by operations/products feed models"
    evidence_class_required: [S]
    evidence_class_required_text: "S (catalogue coverage)"
    kappa_subset: true
    kappa_reason: "Coverage percentage judgement"
    outside_in_proxies:
      - {signal: "Data-platform technographics (BuiltWith)", validation: "No published validation"}
      - {signal: "hyperscaler data-platform case studies naming the firm", validation: "No published validation"}
  - id: D2.4
    dimension: D2
    question: "How ready is your unstructured content for GenAI?"
    anchors:
      1: "Not curated"
      2: "Ad hoc document dumps into a tool"
      3: "Curated, access-controlled corpus serving ≥1 production retrieval application"
      4: "Enterprise document governance (classification, retention, access) feeding retrieval for all production GenAI"
      5: "Usage feedback loops measurably improve corpora (retrieval quality tracked)"
    evidence_class_required: [S]
    evidence_class_required_text: "S (retrieval eval)"
    kappa_subset: false
    outside_in_proxies:
      - {signal: "Postings for knowledge-management / retrieval / \"RAG\" roles", validation: "No published validation"}
      - {signal: "enterprise search vendor case studies", validation: "No published validation"}
  - id: D2.5
    dimension: D2
    question: "Can you trace the provenance of data used by production AI? (ISO 42001 A.7)"
    anchors:
      1: "No"
      2: "Manual notes for some models"
      3: "Lineage and provenance records for data of priority production systems"
      4: "Automated lineage and provenance records for all production AI (A.7.5)"
      5: "Lineage used as audit evidence (internal audit or certification)"
    evidence_class_required: [S]
    evidence_class_required_text: "S (lineage)"
    kappa_subset: true
    kappa_reason: "Provenance completeness (S evidence)"
    outside_in_proxies:
      - {signal: "ISO 42001 or ISO 27001 certification announcements", validation: "No published validation"}
      - {signal: "lineage tooling in technographics", validation: "No published validation"}
  - id: D2.6
    dimension: D2
    question: "How are personal data and cross-border transfers controlled for AI?"
    anchors:
      1: "No AI-specific controls"
      2: "Policy statement only"
      3: "DPIAs completed for AI uses of personal data"
      4: "Per-system residency and transfer register with enforced endpoint allowlists"
      5: "Independently audited (e.g. ISO 27701 / external review)"
    evidence_class_required: [D, S]
    evidence_class_required_text: "D (DPIA) + S (register)"
    kappa_subset: false
    outside_in_proxies:
      - {signal: "Privacy certifications (ISO 27701)", validation: "No published validation"}
      - {signal: "privacy-notice language on AI", validation: "No published validation"}
      - {signal: "regulator enforcement history", validation: "No published validation"}

  # ---------------- D3 Technology & platform ----------------
  - id: D3.1
    dimension: D3
    question: "Where does production AI run?"
    anchors:
      1: "Nowhere; experiments on laptops or consumer SaaS"
      2: "Team-level cloud accounts, no SLAs"
      3: "Production AI on managed infrastructure with SLAs and on-call ownership"
      4: "Shared AI platform (model gateway, vector store, evaluation service) used by ≥3 business units"
      5: "Platform cost/performance benchmarked; multi-model routing in place"
    evidence_class_required: [O, S]
    evidence_class_required_text: "O (platform) + S"
    kappa_subset: false
    outside_in_proxies:
      - {signal: "Hyperscaler partnership announcements", validation: "[P1] AI-skill share of postings"}
      - {signal: "technographics", validation: "[P1] AI-skill share of postings"}
      - {signal: "postings for ML-platform engineers", validation: "[P1] AI-skill share of postings"}
  - id: D3.2
    dimension: D3
    question: "How mature are your LLM operations?"
    anchors:
      1: "None"
      2: "Prompts edited by hand in production"
      3: "Versioned prompts and models with CI for ≥1 production application"
      4: "Evaluation suites, regression tests and drift monitoring across all production GenAI"
      5: "Automated rollback and continuous evaluation with sampled human review"
    evidence_class_required: [S]
    evidence_class_required_text: "S (eval + deployment logs)"
    kappa_subset: true
    kappa_reason: "LLMOps anchors are technical; tests assessor skill variance"
    outside_in_proxies:
      - {signal: "Postings naming LLMOps / evaluation / observability tooling", validation: "[P1]; Accenture names LLMOps as a gen-AI essential [S3]"}
      - {signal: "conference talks by engineers", validation: "[P1]; Accenture names LLMOps as a gen-AI essential [S3]"}
  - id: D3.3
    dimension: D3
    question: "Do you reuse AI components?"
    anchors:
      1: "No"
      2: "Informal copy of code between teams"
      3: "Shared catalogue of ≥5 reusable components (connectors, prompts, agents, guardrails)"
      4: ">50% of new builds reuse catalogued components"
      5: "Components have owners, SLAs and usage metrics"
    evidence_class_required: [S]
    evidence_class_required_text: "S (catalogue + usage)"
    kappa_subset: false
    outside_in_proxies:
      - {signal: "Public engineering blogs describing internal platforms", validation: "PwC leaders 2.4x reusable catalogued components [S8]; no outside-in validation"}
      - {signal: "open-source releases", validation: "PwC leaders 2.4x reusable catalogued components [S8]; no outside-in validation"}
  - id: D3.4
    dimension: D3
    question: "How is AI integrated with systems of record?"
    anchors:
      1: "Not integrated"
      2: "Copy/paste between tools"
      3: "≥1 production AI reads systems of record through governed APIs"
      4: "AI writes to systems of record under change control and logging"
      5: "AI embedded in core transaction workflows with event-level audit logs"
    evidence_class_required: [S]
    evidence_class_required_text: "S (integration logs)"
    kappa_subset: false
    outside_in_proxies:
      - {signal: "Vendor case studies naming core-system integration", validation: "No published validation"}
      - {signal: "API marketplace presence", validation: "No published validation"}
  - id: D3.5
    dimension: D3
    question: "What technical controls run on your AI agents (identity, credentials, logging, kill switch)?"
    anchors:
      1: "No agents, or agents with no technical controls"
      2: "Agents run on human or shared credentials"
      3: "Per-agent identity, tool allowlist and action logs for every production agent"
      4: "Short-lived task-scoped credentials, sandboxed execution, kill switch tested in the last 6 months"
