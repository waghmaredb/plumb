# ---------------------------------------------------------------- figures for the CFO question (string presence checked on page; row read by analyst)
finance_question:
  title: "Malaysia accident and health has become more sensitive to claims experience"
  text: "In the Malaysia segment's sensitivity table, a 10% fall in accident and health claims assumptions moved one year's profit after tax by S$99.3m in 2025, against S$5.9m in 2024. Across life contracts, the loss component on remaining coverage rose from S$727.1m to S$873.9m during 2025. Together these suggest less contractual-service-margin buffer, so claims-cost improvement there may reach profit faster. This is a question for your actuarial team, not a forecast: these are valuation sensitivities of a stock, not an annual saving."
  figures:
    - {label: "Malaysia A&H scenario 4 (−10%), net impact on 1-year profit after tax, 2025 (S$m)", value: "99.3", source: ar2025, pdf_page: 189, kind: sensitivity}
    - {label: "Same scenario, 2024 (S$m)", value: "5.9", source: ar2025, pdf_page: 189, kind: sensitivity}
    - {label: "Life contracts issued — loss component, 1 January 2025 (S$m)", value: "727.1", source: ar2025, pdf_page: 156, kind: balance}
    - {label: "Life contracts issued — loss component, 31 December 2025 (S$m)", value: "873.9", source: ar2025, pdf_page: 156, kind: balance}

