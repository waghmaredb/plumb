# ---------------------------------------------------------------- candidate entries
# basis: disclosed (the client's own AR says it) | secondary (third-party page, unhashed) | group (parent's disclosure)
# build: in-house | vendor | unknown          status: in-use | testing | planned | unknown
entries:
  - id: inv-01
    name: Adviser preparation platform
    stage: Advice
    market: Group
    basis: disclosed
    build: unknown
    status: in-use
    why_it_matters: "Supports advice given to customers; fair-dealing and suitability controls apply to its outputs."
    evidence:
      - {source: ar2025, pdf_page: 14, quote: "In 2025, we deployed an AI-enabled advisory platform that aims to reduce preparation time for financial advisors by approximately 75%, enabling them to focus more on customer engagement and advice."}
    figures:
      - {label: "preparation-time reduction (aim)", value: "75%", source: ar2025, pdf_page: 14, kind: target}
    to_confirm: "Model provider and hosting; whether outputs reach customers unreviewed; owner."

  - id: inv-02
    name: Medical-claims automation platform
    stage: Claims
    market: Singapore
    basis: disclosed
    build: in-house
    status: in-use
    why_it_matters: "Decides or speeds customer claim outcomes at volume; reliance is high once same-day turnaround is the norm."
    evidence:
      - {source: ar2025, pdf_page: 14, quote: "We rolled out a proprietary AI-powered platform to automate medical claims, enhancing claim efficiency while improving customer experience."}
      - {source: ar2025, pdf_page: 40, quote: "In 2025, our AI-driven claims system delivered same-day turnarounds for 75% of medical claims, one of the fastest among Singapore’s health insurers based on Ministry of Health service indicators."}
    figures:
      - {label: "medical claims with same-day turnaround (Singapore, 2025)", value: "75%", source: ar2025, pdf_page: 40, kind: result}
    to_confirm: "Which decisions are automated end to end versus routed to an assessor; override and appeal path."

  - id: inv-03
    name: Complex-case underwriting assistant
    stage: Underwriting
    market: Group
    basis: disclosed
    build: unknown
    status: testing
    why_it_matters: "Underwriting decisions shape who is covered and at what price; MAS expects pilots to be inventoried too."
    evidence:
      - {source: ar2025, pdf_page: 14, quote: "We are also testing an AI solution for complex underwriting cases to further improve automation and associated efficiency."}
    to_confirm: "Whether a reinsurer or vendor engine sits underneath; decision rights during the test."

  - id: inv-04
    name: Underwriting and claims analytics (in-house)
    stage: Underwriting
    market: Singapore
    basis: disclosed
    build: in-house
    status: in-use
    why_it_matters: "Replacing vendor tools with in-house models moves model-risk ownership inside the firm."
    evidence:
      - {source: ar2025, pdf_page: 41, quote: "By sharpening our in-house analytics and AI for underwriting and medical claims, we improved accuracy and consistency while reducing reliance on external vendors."}
    to_confirm: "Which vendor tools were retired, and whether any remain in parallel."

  - id: inv-05
    name: Great CareShield customer segmentation for instant approval
    stage: Onboarding and underwriting
    market: Singapore
    basis: disclosed
    build: unknown
    status: in-use
    why_it_matters: "An automated approval decision on a customer; fairness and explainability expectations are highest here."
    evidence:
      - {source: ar2025, pdf_page: 40, quote: "We further leveraged AI in our customer segmentation process for our supplementary long-term care insurance plan, Great CareShield, to enable instant approvals for existing lower-risk customers."}
    to_confirm: "What happens to customers the model does not approve instantly; fairness testing."

  - id: inv-06
    name: Transaction and sales-pattern monitoring (AML and misconduct)
    stage: Risk and conduct
    market: Singapore
    basis: disclosed
    build: in-house
    status: in-use
    why_it_matters: "A control that other controls rely on; failure is silent, so monitoring of the monitor matters."
    evidence:
      - {source: ar2025, pdf_page: 40, quote: "Complementing these, our proprietary risk management AI solutions strengthen governance by continuously monitoring transactions and sales patterns to proactively detect compliance risks, including anti-money laundering and potential misconduct."}
    to_confirm: "Alert thresholds, false-negative testing, and who validates the model (second line)."

  - id: inv-07
