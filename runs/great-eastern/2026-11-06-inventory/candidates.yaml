# Great Eastern Holdings — outside-in candidate AI inventory (input to plumbinventory)
# Built 2026-11-06. Every `quote` below is string-matched by the build against the stored text of the
# hashed FY2025 annual report (run 2026-10-26-run6, SHA-256 ae320cb3…6488). A quote that does not match
# on its stated PDF page fails the build. Secondary sources are web pages read on 2026-11-06; they are
# NOT hashed and are labelled as such on every surface.
#
# Framing rule (red-team 2026-11-02 §4, §7): this is a starting list for the client's control function
# to confirm, not a gap finding and not a grade. Materiality is MAS's to assign (impact, complexity,
# reliance — Guidelines §4); we give only the reason an entry may matter.

subject: great-eastern
client: Great Eastern Holdings
run: runs/great-eastern/2026-10-26-run6
as_of: 2026-11-06
primary_source:
  id: ar2025
  title: Great Eastern Holdings Annual Report 2025
  url: "https://www.greateasternlife.com/content/dam/corp-site/group/gels-au-corpcomms/english-website/annual-report/great-eastern-holdings-limited-ar-2025.pdf"
  printed_page_offset: -2   # printed page = PDF page - 2 (checked against red-team 2026-11-02 citations)

collector: claude-main-session      # whoever gathered the web sources; may never be the checker
source_checks: source_checks.json   # red-team verdicts (plumbinventory.redteam merge)

